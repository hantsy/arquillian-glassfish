name: Integration Tests

on:
  workflow_call:

jobs:
  gf7-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 7 Managed Tests
        run: ./mvnw -B verify -pl integration-tests --file pom.xml

  gf7-remote:
    runs-on: ubuntu-latest
    services:
      glassfish:
        image: omnifish/glassfish:7.0.14
        ports:
          - 4848:4848
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Wait for GlassFish
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4848 && break
            echo "Waiting for GlassFish admin listener..."
            sleep 10
          done
      - name: Run GF 7 Remote Tests
        run: ./mvnw -B verify -pl integration-tests -Pglassfish-remote --file pom.xml

  gf8-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 8 Managed Tests
        run: ./mvnw -B verify -pl integration-tests -Pglassfish-managed,glassfish8 --file pom.xml

  gf8-remote:
    runs-on: ubuntu-latest
    services:
      glassfish:
        image: ghcr.io/eclipse-ee4j/glassfish:8.0.2
        ports:
          - 4848:4848
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Wait for GlassFish
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4848 && break
            echo "Waiting for GlassFish admin listener..."
            sleep 10
          done
      - name: Run GF 8 Remote Tests
        run: ./mvnw -B verify -pl integration-tests -Pglassfish-remote,glassfish8 --file pom.xml
