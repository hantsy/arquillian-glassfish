name: Integration Tests

on:
  push:
    paths:
      - "common/**"
      - "managed/**"
      - "remote/**"
      - "integration-tests/**"
      - "pom.xml"
      - ".github/workflows/integration-tests.yml"
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "common/**"
      - "managed/**"
      - "remote/**"
      - "integration-tests/**"
      - "pom.xml"
      - ".github/workflows/integration-tests.yml"

jobs:
  gf7-managed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 7 Managed Tests
        run: ./mvnw -B verify -pl integration-tests -am --file pom.xml
      - name: Upload GF7 Managed server.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-gf7-managed
          path: integration-tests/target/glassfish7/glassfish/domains/domain1/logs/server.log

  gf7-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 7 Remote Tests
        run: ./mvnw -B verify -pl integration-tests -am -Premote --file pom.xml
      - name: Upload GF7 Remote server.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-gf7-remote
          path: integration-tests/target/cargo/configurations/glassfish7x/cargo-domain/logs/server.log

  gf8-managed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 8 Managed Tests
        run: ./mvnw -B verify -pl integration-tests -am -Pmanaged,v8 --file pom.xml
      - name: Upload GF8 Managed server.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-gf8-managed
          path: integration-tests/target/glassfish8/glassfish/domains/domain1/logs/server.log

  gf8-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 8 Remote Tests
        run: ./mvnw -B verify -pl integration-tests -am -Premote,v8 --file pom.xml
      - name: Upload GF8 Remote server.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-gf8-remote
          path: integration-tests/target/cargo/configurations/glassfish8x/cargo-domain/logs/server.log

  gf8-managed-derby:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 8 Managed Tests with Derby
        run: ./mvnw -B verify -pl integration-tests -am -Pmanaged,enableDerby,v8 --file pom.xml
      - name: Upload GF8 Managed Derby server.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-gf8-managed-derby
          path: integration-tests/target/glassfish8/glassfish/domains/domain1/logs/server.log

  gf8-remote-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      glassfish:
        image: ghcr.io/eclipse-ee4j/glassfish:8.0.2
        ports:
          - 4848:4848
          - 8080:8080
        env:
          AS_ADMIN_PASSWORD: adminadmin
        options: >-
          --health-cmd "curl -fk https://localhost:4848/ || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"
      - name: Run GF 8 Remote Docker Tests
        run: ./mvnw -B verify -pl integration-tests -am -Premote-docker --file pom.xml
